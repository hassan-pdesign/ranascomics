<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rana's Comics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse at 50% 38%, rgba(198, 162, 86, 0.10) 0%, rgba(0,0,0,0) 55%),
      linear-gradient(160deg, #0a0a0a 0%, #050505 45%, #000000 100%);
    overflow: hidden;
    text-align: center;
  }

  /* falling gold glitter */
  #gold-fall {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 1;
  }
  .gold-dot {
    position: absolute;
    top: -6vh;
    border-radius: 50%;
    will-change: transform;
    animation-name: goldfall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  .gold-dot i {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 45%,
      #fff7da 0%, #f0cf7e 38%, #c79a3c 72%, rgba(199,154,60,0) 100%);
    animation-name: goldtwinkle;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
  }
  @keyframes goldfall {
    from { transform: translateY(0); }
    to   { transform: translateY(118vh); }
  }
  @keyframes goldtwinkle {
    0%, 100% { opacity: 0.2; }
    50%      { opacity: 1; }
  }

  /* keep title and text above the glitter */
  .title, .divider, .subtitle { position: relative; z-index: 2; }

  .title {
    font-family: 'Cinzel', serif;
    font-weight: 900;
    font-size: clamp(2.8rem, 11vw, 9rem);
    letter-spacing: 0.04em;
    line-height: 1;
    background: linear-gradient(
      100deg,
      #9c6f24 0%,
      #d4af5a 22%,
      #f6e7b8 38%,
      #fff7da 46%,
      #f6e7b8 54%,
      #b8862f 70%,
      #e8cf86 86%,
      #9c6f24 100%
    );
    background-size: 220% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: #d4af5a;
    text-shadow: 0 2px 30px rgba(198, 162, 86, 0.18);
    padding: 0 0.15em;
    opacity: 0;
    animation:
      rise 1.4s cubic-bezier(0.22, 1, 0.36, 1) 0.25s forwards,
      shimmer 9s ease-in-out 1.6s infinite;
  }

  .divider {
    width: clamp(70px, 14vw, 150px);
    height: 1px;
    margin: clamp(1.4rem, 3.5vw, 2.6rem) auto;
    background: linear-gradient(90deg, transparent, rgba(198,162,86,0.85), transparent);
    position: relative;
    opacity: 0;
    transform: scaleX(0.3);
    animation: spread 1.6s cubic-bezier(0.22, 1, 0.36, 1) 0.7s forwards;
  }

  .divider::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 5px;
    height: 5px;
    background: #d4af5a;
    transform: translate(-50%, -50%) rotate(45deg);
    box-shadow: 0 0 8px rgba(198,162,86,0.6);
    animation: twinkle 4.5s ease-in-out 2s infinite;
  }

  .subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: clamp(0.85rem, 2.4vw, 1.35rem);
    letter-spacing: 0.55em;
    text-transform: uppercase;
    color: rgba(214, 197, 158, 0.78);
    padding-left: 0.55em;
    opacity: 0;
    animation: rise 1.4s cubic-bezier(0.22, 1, 0.36, 1) 1s forwards;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes spread {
    to { opacity: 1; transform: scaleX(1); }
  }
  @keyframes shimmer {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 200% 50%; }
    100% { background-position: 0% 50%; }
  }
  @keyframes twinkle {
    0%, 100% { box-shadow: 0 0 6px rgba(198,162,86,0.5); }
    50%      { box-shadow: 0 0 16px rgba(232,207,134,0.95); }
  }

  @media (prefers-reduced-motion: reduce) {
    .title, .divider, .divider::before, .subtitle {
      animation: none;
      opacity: 1;
      transform: none;
    }
    #gold-fall { display: none; }
  }
</style>
</head>
<body>
  <div id="gold-fall"></div>
  <h1 class="title">Rana's Comics</h1>
  <div class="divider"></div>
  <p class="subtitle">Coming Soon</p>

<script>
(function () {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const layer = document.getElementById('gold-fall');
  const rand = (min, max) => Math.random() * (max - min) + min;

  const TOTAL = 22; // sparse

  for (let i = 0; i < TOTAL; i++) {
    const depth = Math.random();                 // 0 far -> 1 near
    const size = rand(1.5, 5) * (0.6 + depth);    // near = a touch bigger
    const fallDur = rand(38, 22) - depth * 5;     // slow; near slightly faster
    const twinkleDur = rand(2.5, 5.5);
    const glow = (1.5 + depth * 4).toFixed(1);
    const blur = (1 - depth) * 1.4;

    const dot = document.createElement('div');
    dot.className = 'gold-dot';
    dot.style.left = rand(0, 100) + 'vw';
    dot.style.width = size.toFixed(1) + 'px';
    dot.style.height = size.toFixed(1) + 'px';
    dot.style.opacity = (0.35 + depth * 0.5).toFixed(2);
    dot.style.zIndex = Math.round(depth * 3);
    dot.style.filter = `drop-shadow(0 0 ${glow}px rgba(232,207,134,0.85))` +
                       (blur > 0.3 ? ` blur(${blur.toFixed(1)}px)` : '');
    dot.style.animationDuration = fallDur.toFixed(1) + 's';
    dot.style.animationDelay = (-rand(0, fallDur)).toFixed(1) + 's';

    const inner = document.createElement('i');
    inner.style.animationDuration = twinkleDur.toFixed(1) + 's';
    inner.style.animationDelay = (-rand(0, twinkleDur)).toFixed(1) + 's';

    dot.appendChild(inner);
    layer.appendChild(dot);
  }
})();
</script>
</body>
</html>

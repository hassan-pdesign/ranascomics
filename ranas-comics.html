<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rana's Comics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse at 50% 38%, rgba(198, 162, 86, 0.10) 0%, rgba(0,0,0,0) 55%),
      linear-gradient(160deg, #0a0a0a 0%, #050505 45%, #000000 100%);
    overflow: hidden;
    text-align: center;
  }

  /* Hairline gold frame */
  .frame {
    position: fixed;
    inset: 22px;
    border: 1px solid rgba(198, 162, 86, 0.28);
    pointer-events: none;
  }

  .title {
    font-family: 'Cinzel', serif;
    font-weight: 900;
    font-size: clamp(2.8rem, 11vw, 9rem);
    letter-spacing: 0.04em;
    line-height: 1;
    background: linear-gradient(
      175deg,
      #f6e7b8 0%,
      #d4af5a 28%,
      #b8862f 50%,
      #e8cf86 72%,
      #9c6f24 100%
    );
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: #d4af5a;
    text-shadow: 0 2px 30px rgba(198, 162, 86, 0.18);
    padding: 0 0.15em;
  }

  .divider {
    width: clamp(70px, 14vw, 150px);
    height: 1px;
    margin: clamp(1.4rem, 3.5vw, 2.6rem) auto;
    background: linear-gradient(90deg, transparent, rgba(198,162,86,0.85), transparent);
    position: relative;
  }

  .divider::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 5px;
    height: 5px;
    background: #d4af5a;
    transform: translate(-50%, -50%) rotate(45deg);
    box-shadow: 0 0 8px rgba(198,162,86,0.6);
  }

  .subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: clamp(0.85rem, 2.4vw, 1.35rem);
    letter-spacing: 0.55em;
    text-transform: uppercase;
    color: rgba(214, 197, 158, 0.78);
    padding-left: 0.55em;
  }
</style>
</head>
<body>
  <div class="frame"></div>
  <h1 class="title">Rana's Comics</h1>
  <div class="divider"></div>
  <p class="subtitle">Coming Soon</p>
</body>
</html>
